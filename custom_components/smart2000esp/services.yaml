set_update_interval:
  name: Change Smart2000ESP throttling interval at runtime.
  description: Update interval in seconds (0.1–600). Leave empty to reset to default (5.0s).
  fields:
    seconds:
      name: Update interval (seconds)
      description: Update interval in seconds (0.1–600). Leave empty to reset to default (5.0s).
      required: false
      example: 0.5
      selector:
        number:
          min: 0.1
          max: 600
          step: 0.1
          mode: box